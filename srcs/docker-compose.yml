services:

  wordpress:
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - data_wordpress:/var/www/wordpress
    depends_on:
      - mariadb
    networks:
      - Inception
  nginx:
    build: requirements/nginx
    ports:
      - "443:443"
    env_file:
      - .env
    depends_on:
      - wordpress
    volumes:
      - data_wordpress:/var/www/wordpress
    networks:
      - Inception
    restart: always
  mariadb:
    build: requirements/mariadb
    ports:
      - "3306:3306"
    env_file:
      - .env
    networks:
      - Inception

volumes:
  data_wordpress:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/aalimous/data/wordpress'
  data_mariadb:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '/home/aalimous/data/mariadb'
networks:
  Inception: